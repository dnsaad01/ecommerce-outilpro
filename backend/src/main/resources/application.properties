spring.application.name=backend

# Toutes les valeurs ci-dessous ont une valeur par défaut adaptée au développement local
# (${VAR:defaut}) -- en production, le profil application-prod.properties réutilise les
# MÊMES noms de variables d'environnement mais SANS valeur par défaut, pour forcer leur
# définition explicite au démarrage (voir ce fichier pour le détail).
server.port=${SERVER_PORT:8081}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5435/outilpro?ssl=false&prepareThreshold=0}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:outilpro}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:outilpro}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.postgresql.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:QS3vRoyrqG+aPyE2ZXX33qCSvmMb5RKab64qJ7Ae3JY=}
# Durée de vie max du token (2h) : borne absolue côté serveur, indépendante de la
# déconnexion par inactivité gérée côté frontend (voir AuthContext.jsx, 30 min).
# Était 86400000 (24h) -- resserré pour une interface d'administration.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:ChangeMoiImmediatement123!}
app.employe.username=${EMPLOYE_USERNAME:employe}
app.employe.password=${EMPLOYE_PASSWORD:ChangeMoiAussi123!}
app.base-url=${APP_BASE_URL:http://localhost:8081}
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.stock.seuil-alerte=${STOCK_SEUIL_ALERTE:5}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Origines autorisées en CORS (séparées par des virgules) -- voir SecurityConfig.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Rate limiting (anti-DDoS / anti-brute-force) -- voir RateLimitingFilter. Toutes les
# fenêtres sont en secondes. La règle globale couvre tout /api/**, les règles dédiées
# s'appliquent EN PLUS sur leur route précise (les deux quotas doivent être respectés).
app.rate-limit.global.capacity=${RATE_LIMIT_GLOBAL_CAPACITY:300}
app.rate-limit.global.window-seconds=${RATE_LIMIT_GLOBAL_WINDOW:60}
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
app.rate-limit.commande.capacity=${RATE_LIMIT_COMMANDE_CAPACITY:10}
app.rate-limit.commande.window-seconds=${RATE_LIMIT_COMMANDE_WINDOW:60}
app.rate-limit.promo.capacity=${RATE_LIMIT_PROMO_CAPACITY:15}
app.rate-limit.promo.window-seconds=${RATE_LIMIT_PROMO_WINDOW:60}

# Notification Telegram a l'equipe admin lors d'une nouvelle commande (optionnel : si
# TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID est vide, la notification est simplement desactivee).
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.base-url-admin=${APP_BASE_URL_ADMIN:http://localhost:5173}

# Mode maintenance : quand actif, le frontend affiche une page "site en maintenance"
# a la place des pages publiques (l'admin /admin reste toujours accessible). Ne
# necessite aucun changement de code : juste la variable d'environnement MAINTENANCE_MODE
# puis un redeploiement du backend (voir ConfigController).
app.maintenance-mode=${MAINTENANCE_MODE:false}
