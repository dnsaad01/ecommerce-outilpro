# =============================================================================
# Profil de PRODUCTION -- chargé uniquement quand SPRING_PROFILES_ACTIVE=prod
# (variable d'environnement définie sur le serveur, JAMAIS dans ce fichier ni dans
# application.properties -- sinon la prod s'activerait aussi en local).
#
# Principe directeur : toutes les valeurs sensibles ci-dessous sont écrites
# ${VARIABLE} SANS valeur par défaut (contrairement à application.properties qui,
# lui, a des défauts pratiques pour le développement local). Résultat : si une seule
# de ces variables n'est pas définie sur le serveur de prod, le démarrage échoue
# immédiatement avec un message explicite ("Could not resolve placeholder ...")
# au lieu de démarrer silencieusement avec un mot de passe ou un secret JWT de
# développement connu de tous -- un démarrage qui échoue bruyamment est toujours
# préférable à une prod qui tourne avec des identifiants par défaut.
# =============================================================================

# --- Base de données (obligatoire) ---
# Exemple : jdbc:postgresql://db-host:5432/outilpro?sslmode=require
# Le "sslmode=require" (ou "ssl=true" selon le fournisseur) n'est PAS optionnel en
# prod, contrairement au ssl=false du défaut local -- à adapter selon l'hébergeur
# (RDS, Supabase, Neon, etc. imposent chacun leur propre paramètre SSL).
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# --- Hibernate : niveau sécurisé pour la prod ---
# "validate" (jamais "update" ni "create-drop" !) : au démarrage, Hibernate vérifie
# seulement que le schéma de la base correspond aux entités JPA -- il ne le modifie
# JAMAIS lui-même. Toute évolution de schéma en prod doit passer par une migration
# explicite, relue et versionnée (ex: Flyway/Liquibase -- pas encore en place dans
# ce projet, voir la remarque de déploiement fournie à part), jamais par une
# auto-modification silencieuse au démarrage comme le permet "update" en dev.
# IMPORTANT : avec "validate", la base de prod doit déjà avoir le bon schéma AVANT
# le tout premier démarrage en prod (voir instructions de déploiement).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# --- Désactivation des fuites d'information en cas d'erreur ---
# Par défaut Spring Boot peut inclure la stack trace, le message d'exception brut et
# le détail des erreurs de validation dans la réponse HTTP -- utile en dev, mais une
# fuite d'information en prod (chemins de fichiers, structure interne, versions de
# librairies). GlobalExceptionHandler renvoie déjà des messages propres et maîtrisés :
# ces réglages empêchent Spring d'en ajouter davantage par-dessus.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# --- Logs : aucun détail SQL/paramètres, pas de niveau DEBUG en prod ---
logging.level.root=WARN
logging.level.com.outilpro.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN

# --- JWT (obligatoire, aucun secret de développement en prod) ---
# Générer un secret fort et unique pour la prod, par exemple :
#   openssl rand -base64 32
# Ne JAMAIS réutiliser le secret par défaut présent dans application.properties.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:7200000}

# --- Comptes admin/employé initiaux (obligatoires) ---
# DataInitializer ne crée ces comptes QUE s'ils n'existent pas encore -- au premier
# démarrage en prod, choisir ici un mot de passe fort, différent des valeurs de dev
# ("ChangeMoiImmediatement123!" etc.), et le changer depuis l'admin ensuite si besoin.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.employe.username=${EMPLOYE_USERNAME}
app.employe.password=${EMPLOYE_PASSWORD}

# --- CORS ---
# Domaine officiel (acheté sur Namecheap) : spartakbrico.com -- les deux variantes
# (avec et sans "www") sont autorisées, selon celle que les visiteurs utilisent
# réellement. Toujours surchargeable via la variable d'environnement (ex: pour ajouter
# un sous-domaine de staging), mais ce défaut suffit pour un déploiement direct.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://spartakbrico.com,https://www.spartakbrico.com}

# --- URL publique du backend ---
# Utilisée pour générer les liens d'images uploadées (/uploads/**) renvoyés à l'admin.
# Sous-domaine dédié à l'API, à pointer vers le serveur backend une fois hébergé
# (enregistrement DNS A/CNAME à créer chez Namecheap pour api.spartakbrico.com).
app.base-url=${APP_BASE_URL:https://api.spartakbrico.com}

# --- Port du serveur ---
# La plupart des hébergeurs (Render, Railway, Heroku-like...) imposent leur propre
# port via la variable PORT -- SERVER_PORT reste la valeur attendue par Spring Boot ;
# adapter le nom de la variable d'environnement fournie par l'hébergeur si besoin.
server.port=${SERVER_PORT:8081}

# --- Dossier de stockage des images uploadées ---
# En prod, pointer vers un volume persistant (pas le système de fichiers éphémère du
# conteneur, sous peine de perdre toutes les images uploadées à chaque redéploiement).
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# --- Rate limiting ---
# Les seuils par défaut (voir application.properties) conviennent déjà à la prod ;
# ajustables indépendamment via ces mêmes variables si le trafic réel l'impose.
app.rate-limit.global.capacity=${RATE_LIMIT_GLOBAL_CAPACITY:300}
app.rate-limit.global.window-seconds=${RATE_LIMIT_GLOBAL_WINDOW:60}
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:5}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
app.rate-limit.commande.capacity=${RATE_LIMIT_COMMANDE_CAPACITY:10}
app.rate-limit.commande.window-seconds=${RATE_LIMIT_COMMANDE_WINDOW:60}
app.rate-limit.promo.capacity=${RATE_LIMIT_PROMO_CAPACITY:15}
app.rate-limit.promo.window-seconds=${RATE_LIMIT_PROMO_WINDOW:60}

# --- Multipart (taille max des fichiers uploadés, image produit) ---
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Notification Telegram a l'equipe admin lors d'une nouvelle commande (optionnel : si
# TELEGRAM_BOT_TOKEN ou TELEGRAM_CHAT_ID n'est pas defini, la notification est simplement
# desactivee -- pas de valeur par defaut ici pour forcer une config explicite en prod).
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.chat-id=${TELEGRAM_CHAT_ID:}
app.base-url-admin=${APP_BASE_URL_ADMIN:https://spartakbrico.com}
