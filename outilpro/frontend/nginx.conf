server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-tetes de securite basiques
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Fichiers statiques : cache long (noms de fichiers hashes par Vite)
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ne doit JAMAIS etre mis en cache par le navigateur : c'est lui qui reference
    # les noms de fichiers JS/CSS hashes par Vite. Sans ce header, certains navigateurs le
    # gardent en cache heuristique (pas d'en-tete Cache-Control explicite = ils improvisent),
    # et un visiteur recurrent continue de charger un ancien bundle JS meme apres un
    # redeploiement -- symptome deja observe plusieurs fois (textes/traductions pas a jour).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    # SPA : toute route inconnue retombe sur index.html (React Router gere la navigation cote client)
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # Pas d'exposition des fichiers caches (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
