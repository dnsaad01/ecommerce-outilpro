server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # En-tetes de securite basiques
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Fichiers statiques : cache long (noms de fichiers hashes par Vite)
    location ~* \.(?:css|js|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA : toute route inconnue retombe sur index.html (React Router gere la navigation cote client)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pas d'exposition des fichiers caches (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
